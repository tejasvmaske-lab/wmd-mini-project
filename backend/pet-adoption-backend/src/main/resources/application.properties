# App name and Port
server.port=8081

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auth0 access token validation for pet adoption
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-m67g0yz3zydvbfeg.us.auth0.com/
auth0.jwks-uri=https://dev-m67g0yz3zydvbfeg.us.auth0.com/.well-known/jwks.json
auth0.audience=https://api.pawfect.local
admin.jwt-secret=${ADMIN_JWT_SECRET:pet-adoption-admin-jwt-secret-change-me}